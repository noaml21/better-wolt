<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f1330" />
    <meta
      name="description"
      content="Better Wolt — משלוחים מהמסעדות הטובות בעיר. מזמינים בכמה הקשות, עוקבים אחרי השליח עד הדלת."
    />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=Suez+One&display=swap"
      rel="stylesheet"
    />

    <title>Better Wolt — משלוחי אוכל</title>
  </head>
  <body class="light">
    <script>
      /* Pick the theme before the first paint, the same way ThemeContext
         does after it: the stored choice, else the system's. Without this a
         dark-mode visitor sees a white page until React mounts. */
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.body.className = 'dark';
      } catch (e) {}
    </script>
    <noscript>כדי להשתמש ב-Better Wolt צריך להפעיל JavaScript בדפדפן.</noscript>
    <div id="root"></div>
  </body>
</html>
